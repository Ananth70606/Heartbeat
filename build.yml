name: Build Heartbeat APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Extract Android project ZIP
        shell: bash
        run: |
          set -e

          ZIP_FILE=$(find . -maxdepth 2 -type f -name '*.zip' | head -n 1)

          if [ -n "$ZIP_FILE" ]; then
            echo "Found ZIP: $ZIP_FILE"
            mkdir -p android-project
            unzip -q "$ZIP_FILE" -d android-project

            # If the ZIP contains one top-level folder, use that folder as the project root.
            TOP_DIRS=$(find android-project -mindepth 1 -maxdepth 1 -type d | wc -l)
            TOP_FILES=$(find android-project -mindepth 1 -maxdepth 1 -type f | wc -l)

            if [ "$TOP_DIRS" -eq 1 ] && [ "$TOP_FILES" -eq 0 ]; then
              PROJECT_DIR=$(find android-project -mindepth 1 -maxdepth 1 -type d | head -n 1)
            else
              PROJECT_DIR="android-project"
            fi
          else
            echo "No ZIP found. Checking the repository root for an Android project."
            PROJECT_DIR="."
          fi

          GRADLEW=$(find "$PROJECT_DIR" -type f -name gradlew -print -quit)

          if [ -z "$GRADLEW" ]; then
            echo "ERROR: gradlew was not found."
            echo "The ZIP must contain a complete Gradle Android project."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$GRADLEW")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          chmod +x "$PROJECT_DIR/gradlew"

          echo "Android project: $PROJECT_DIR"

      - name: Build debug APK
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR"
          ./gradlew assembleDebug --stacktrace

      - name: Find APK
        shell: bash
        run: |
          set -e
          APK=$(find "$PROJECT_DIR" -type f -path '*/build/outputs/apk/*/*.apk' | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not created."
            exit 1
          fi

          echo "APK=$APK" >> "$GITHUB_ENV"
          echo "Created: $APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Heartbeat-debug-apk
          path: ${{ env.APK }}
          if-no-files-found: error
